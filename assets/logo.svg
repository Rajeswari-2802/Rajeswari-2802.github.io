<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="RT monogram">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#b8ffd0"/>
      <stop offset=".35" stop-color="#3ee07a"/>
      <stop offset="1" stop-color="#0b5a2c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a40"/>
      <stop offset=".5" stop-color="#101814"/>
      <stop offset="1" stop-color="#2b3a31"/>
    </linearGradient>
  </defs>
  <!-- outer hex rim -->
  <polygon points="60,4 108.5,32 108.5,88 60,116 11.5,88 11.5,32" fill="url(#rim)" stroke="#1fb05a" stroke-width="2"/>
  <!-- chip pins -->
  <g stroke="#1fb05a" stroke-width="2" stroke-linecap="round" opacity=".85">
    <path d="M40 22v-7M60 18v-8M80 22v-7M40 98v7M60 102v8M80 98v7"/>
  </g>
  <!-- inner segmented ring -->
  <circle cx="60" cy="60" r="36" fill="#06110b" stroke="#1fb05a" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="31" fill="none" stroke="#3ee07a" stroke-width="3" stroke-dasharray="10 6" opacity=".7"/>
  <!-- core -->
  <circle cx="60" cy="60" r="24" fill="url(#core)"/>
  <!-- RT monogram -->
  <g fill="none" stroke="#04160b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46 72V48h9a6.5 6.5 0 0 1 0 13h-9M55 61l7 11"/>
    <path d="M63 48h14M70 48v24"/>
